<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的工具箱 · 入口导航</title>
<meta name="description" content="个人工具门户：减脂、电商、副业、学习、效率、记账等自建工具统一入口。">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#fbfbfd;
    --card:#ffffff;
    --text:#15181f;
    --text-2:#5f6875;
    --text-3:#9aa4b2;
    --line:#edeff3;
    --line-2:#e2e6ec;
    --brand:#4f46e5;
    --rest:0 1px 2px rgba(16,24,40,.03);
    --hover:0 4px 12px rgba(16,24,40,.06), 0 18px 44px rgba(16,24,40,.10);
    --r:17px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;
    padding-bottom:56px;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px}

  /* ============ HERO ============ */
  .hero{
    position:relative;overflow:hidden;
    background:linear-gradient(180deg,#f5f6fc 0%,#fbfbfd 100%);
    border-bottom:1px solid var(--line);
  }
  .hero::before{
    content:"";position:absolute;inset:-40% 0 auto 0;height:340px;
    background:
      radial-gradient(520px 200px at 18% 0%, rgba(99,102,241,.11), transparent 70%),
      radial-gradient(460px 180px at 78% 10%, rgba(236,72,153,.08), transparent 70%);
    pointer-events:none;
  }
  .hero-in{position:relative;padding:44px 0 26px}
  .brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{
    width:52px;height:52px;border-radius:16px;flex:none;
    background:linear-gradient(135deg,#6366f1,#8b5cf6 52%,#ec4899);
    display:grid;place-items:center;color:#fff;
    box-shadow:0 6px 18px rgba(99,102,241,.28), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .logo svg{width:26px;height:26px}
  h1{font-size:29px;font-weight:680;letter-spacing:-.025em;line-height:1.2}
  .tagline{font-size:14px;color:var(--text-2);margin-top:3px}
  .stats{display:flex;gap:30px;margin-left:auto;flex-wrap:wrap}
  .stat b{display:block;font-size:23px;font-weight:660;letter-spacing:-.02em;line-height:1.2}
  .stat span{font-size:12px;color:var(--text-3)}

  /* ============ 吸顶工具栏 ============ */
  .toolbar{
    position:sticky;top:0;z-index:30;
    background:rgba(251,251,253,.82);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line);
  }
  .toolbar-in{display:flex;align-items:center;gap:14px;padding:13px 0;flex-wrap:wrap}
  .search{position:relative;flex:1;min-width:220px;max-width:340px}
  .search svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--text-3);pointer-events:none;
  }
  #q{
    width:100%;padding:10px 14px 10px 37px;
    border:1px solid var(--line-2);border-radius:12px;
    background:#fff;font-size:14px;color:var(--text);
    font-family:inherit;outline:none;transition:.16s;
    box-shadow:0 1px 2px rgba(16,24,40,.03);
  }
  #q:focus{border-color:#a5b4fc;box-shadow:0 0 0 4px rgba(99,102,241,.13)}
  #q::placeholder{color:var(--text-3)}
  kbd{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-size:11px;color:var(--text-3);border:1px solid var(--line-2);
    border-radius:6px;padding:1px 6px;background:#fafbfc;font-family:inherit;
  }
  #q:focus + kbd{display:none}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .chip{
    border:1px solid var(--line-2);background:#fff;
    padding:6px 15px;border-radius:999px;font-size:13px;
    color:var(--text-2);cursor:pointer;transition:.15s;
    font-family:inherit;white-space:nowrap;
    box-shadow:0 1px 2px rgba(16,24,40,.03);
  }
  .chip:hover{border-color:#c7d2fe;color:var(--text)}
  .chip.on{
    background:var(--brand);border-color:var(--brand);color:#fff;
    box-shadow:0 3px 10px rgba(79,70,229,.28);
  }

  /* ============ 最近使用 ============ */
  .recent{padding:22px 0 2px}
  .recent:empty{display:none}
  .sec-t{font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.09em;margin-bottom:11px}
  .recent-row{display:flex;gap:9px;flex-wrap:wrap}
  .rc{
    display:flex;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line);
    padding:6px 14px 6px 7px;border-radius:999px;
    font-size:13px;transition:.15s;box-shadow:var(--rest);
  }
  .rc:hover{border-color:#c7d2fe;transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,24,40,.07)}
  .rc i{
    position:relative;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 0 0 1px rgba(255,255,255,.14),
               0 2px 6px -2px var(--gl,rgba(16,24,40,.3));
  }
  .rc i svg{width:15px;height:15px;color:#fff;position:relative;z-index:2;
            filter:drop-shadow(0 1px 1px rgba(0,0,0,.16))}

  /* ============ 分区 ============ */
  section{padding:26px 0 2px}
  .sec-h{display:flex;align-items:center;gap:10px;margin-bottom:15px}
  .bar{width:3px;height:15px;border-radius:2px;flex:none}
  .sec-h h2{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
  .count{
    font-size:11.5px;color:var(--text-3);background:#f2f4f7;
    padding:1px 8px;border-radius:999px;font-weight:500;
  }
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(268px,1fr))}

  /* ============ 卡片 ============ */
  .card{
    position:relative;display:flex;gap:14px;
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:17px;
    transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .18s, border-color .18s;
    box-shadow:var(--rest);
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--hover);border-color:#dfe3ea}
  .card:active{transform:translateY(-1px)}
  .ic{
    position:relative;width:52px;height:52px;border-radius:16px;flex:none;
    display:grid;place-items:center;color:#fff;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.46),
      inset 0 0 0 1px rgba(255,255,255,.14),
      0 4px 11px -3px var(--gl,rgba(16,24,40,.28));
    transition:transform .24s cubic-bezier(.2,.7,.3,1), box-shadow .24s;
  }
  .ic::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(118% 88% at 24% 6%, rgba(255,255,255,.30), rgba(255,255,255,0) 58%);
  }
  .ic svg{
    width:26px;height:26px;position:relative;z-index:2;
    filter:drop-shadow(0 1px 1.2px rgba(0,0,0,.16));
  }
  .card:hover .ic{
    transform:scale(1.09) rotate(-3deg);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.56),
      inset 0 0 0 1px rgba(255,255,255,.22),
      0 9px 22px -5px var(--gl,rgba(16,24,40,.34));
  }
  .card-body{flex:1;min-width:0}
  .card h3{
    font-size:15px;font-weight:630;letter-spacing:-.012em;line-height:1.4;
    display:flex;align-items:center;gap:5px;
  }
  .arrow{
    opacity:0;transform:translate(-3px,2px);transition:.18s;
    color:var(--text-3);font-size:13px;font-weight:400;
  }
  .card:hover .arrow{opacity:1;transform:translate(0,1px)}
  .card p{font-size:12.5px;color:var(--text-2);margin-top:3px;line-height:1.6;min-height:40px}
  .meta{
    display:flex;align-items:center;gap:6px;
    margin-top:11px;padding-top:10px;border-top:1px solid #f3f5f8;
    font-size:11.5px;color:var(--text-3);
  }
  .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .dot.live{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15)}
  .dot.arch{background:#cbd5e1}
  .meta .url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .tag{
    position:absolute;top:14px;right:14px;
    font-size:10.5px;color:var(--text-3);
    background:#f5f7fa;border:1px solid var(--line);
    border-radius:6px;padding:1px 7px;
  }
  .archived .ic{filter:grayscale(1);opacity:.5}
  .archived h3{color:var(--text-2)}

  .empty{text-align:center;padding:60px 20px;color:var(--text-3);font-size:14px}
  .empty b{display:block;color:var(--text-2);font-size:15px;margin-bottom:5px}

  footer{
    margin-top:40px;padding:20px 0 0;border-top:1px solid var(--line);
    font-size:12px;color:var(--text-3);
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .hidden{display:none !important}

  @media (max-width:720px){
    .hero-in{padding:32px 0 22px}
    .stats{margin-left:0;gap:22px;width:100%}
    .stat b{font-size:20px}
    h1{font-size:24px}
    .toolbar-in{gap:10px;padding:11px 0}
    .search{max-width:none;flex-basis:100%}
    .filters{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
    .filters::-webkit-scrollbar{display:none}
  }
  @media (max-width:640px){
    .wrap{padding:0 15px}
    .grid{grid-template-columns:1fr;gap:11px}
    .card{padding:14px}
    .ic{width:46px;height:46px;border-radius:14px}
    .ic svg{width:23px;height:23px}
    .card p{min-height:0}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap hero-in">
    <div class="brand">

  { cat:"健康生活", name:"今天吃什么 · 减脂版", desc:"按热量与口味给出当天三餐搭配建议", url:"tools/diet-picker/", host:"本站", icon:"i-utensils", g:"linear-gradient(135deg,#7ed957,#3f9c35)", live:1 },

  { cat:"搞钱与财务", name:"电商作战室", desc:"选品流水线 · 素材库 · 内容生成 · 市场情报", url:"https://xiaomin999.github.io/ecom-warroom/", host:"github.io", icon:"i-cart", g:"linear-gradient(135deg,#5b9dff,#2563eb)", live:1, tag:"PWA" },
  { cat:"搞钱与财务", name:"副业收集工作台", desc:"86 条副业点子库 · 收益测算 · 决策对比", url:"https://xiaomin999.github.io/side-hustle-hub/", host:"github.io", icon:"i-bulb", g:"linear-gradient(135deg,#ffc14d,#f59e0b)", live:1, tag:"PWA" },
  { cat:"搞钱与财务", name:"基金交易判断工作台", desc:"交易信号看板，A 股配色（涨红跌绿）", url:"tools/fund-workbench/", host:"本站", icon:"i-trend", g:"linear-gradient(135deg,#ff8080,#dc2626)", live:1 },
  { cat:"搞钱与财务", name:"简记 · 记账", desc:"收支记账 · 分类占比 · Supabase 云同步", url:"https://xiaomin999.github.io/jianji/", host:"github.io", icon:"i-wallet", g:"linear-gradient(135deg,#f5c451,#d99e0b)", live:1 },

  { cat:"内容运营", name:"红算子 · 小红书运营", desc:"采集雷达 · 内容工坊 · 转化路径 · 成长路线图", url:"https://xiaomin999.github.io/xhs-workbench/", host:"github.io", icon:"i-megaphone", g:"linear-gradient(135deg,#ff6b8b,#e11d48)", live:1 },
  { cat:"内容运营", name:"公众号全栈助推助手", desc:"定位排期 · 选题 · 写稿 · 配图 · 复盘全流程", url:"https://xiaomin999.github.io/gzh-booster/", host:"github.io", icon:"i-rocket", g:"linear-gradient(135deg,#ffa94d,#f76707)", live:1, tag:"PWA" },
  { cat:"内容运营", name:"公众号 AI 写作工作台（初版）", desc:"已被「公众号全栈助推助手」取代，留档参考", url:"tools/gzh-ai-writer/", host:"归档", icon:"i-edit", g:"linear-gradient(135deg,#cbd5e1,#94a3b8)", live:0, tag:"旧版" },

  { cat:"学习成长", name:"雅思学习平台", desc:"每日单词 · 影子跟读 · 口语练习 · 间隔复习", url:"tools/ielts-prep/", host:"本站", icon:"i-globe", g:"linear-gradient(135deg,#8b8cf0,#5b5bd6)", live:1 },
  { cat:"学习成长", name:"学习工作台 · 四合一", desc:"SQL / Excel / Python / Java 刷题练习", url:"tools/study-workbench/", host:"本站", icon:"i-code", g:"linear-gradient(135deg,#3ec9d6,#0891b2)", live:1 },
  { cat:"学习成长", name:"小陈自用学习计划", desc:"岗位能力拆解 · 分阶段路线图 · 每日计划", url:"tools/career-study-plan/", host:"本站", icon:"i-route", g:"linear-gradient(135deg,#b39dfb,#7c3aed)", live:1 },
  { cat:"学习成长", name:"学习目标管理台", desc:"今日 / 看板 / 周视图 / 我的，目标与打卡", url:"tools/goal-tracker/", host:"本站", icon:"i-target", g:"linear-gradient(135deg,#5fd18c,#16a34a)", live:1 },

  { cat:"效率工具", name:"小助理自律工作台", desc:"待办 · 习惯 · 打卡 · 复盘 · 理财", url:"tools/self-discipline-hub/", host:"本站", icon:"i-check", g:"linear-gradient(135deg,#ff8fb1,#e5367e)", live:1 },
  { cat:"效率工具", name:"个人办公台", desc:"今日待办 · 灵感速记 · 项目跟进 · 周复盘", url:"tools/office-workbench/", host:"本站", icon:"i-case", g:"linear-gradient(135deg,#94a3b8,#475569)", live:1 },
  { cat:"效率工具", name:"数据分析工作台", desc:"任务看板 · SQL/Python 片段库 · 指标字典", url:"tools/data-analysis-workbench/", host:"本站", icon:"i-bar", g:"linear-gradient(135deg,#4fb0e8,#0284c7)", live:1 },
  { cat:"效率工具", name:"Boardly 协作白板", desc:"Canvas 绘图白板，支持网格开关", url:"tools/whiteboard/", host:"本站", icon:"i-pen", g:"linear-gradient(135deg,#ffab6b,#ea580c)", live:1 },
  { cat:"效率工具", name:"个人计划表", desc:"日程与计划编排，Supabase 云同步", url:"https://xiaomin999.github.io/personal-plan/", host:"github.io", icon:"i-calendar", g:"linear-gradient(135deg,#74c0fc,#1c7ed6)", live:1 },
  { cat:"效率工具", name:"微步 MicroStep", desc:"把大目标拆成每天可执行的一小步", url:"tools/microstep/", host:"本站", icon:"i-steps", g:"linear-gradient(135deg,#b197fc,#7048e8)", live:1 }
];

const CAT_COLOR = {
  "健康生活":"#f4511e",
  "搞钱与财务":"#2563eb",
  "内容运营":"#e11d48",
  "学习成长":"#7c3aed",
  "效率工具":"#0d9488"
};
const CATS = [...new Set(TOOLS.map(t => t.cat))];
const KEY = "hub_recent_v1";
/* 由渐变末色生成同色柔光 */
function glow(g){
  const hs = (g.match(/#[0-9a-fA-F]{6}/g) || []);
  if(!hs.length) return "rgba(16,24,40,.28)";
  const n = parseInt(hs[hs.length - 1].slice(1), 16);
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + ",.45)";
}
const $ = s => document.querySelector(s);

/* ---- 最近使用 ---- */
function getRecent(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; }
}
function markRecent(name){
  let r = getRecent().filter(n => n !== name);
  r.unshift(name);
  r = r.slice(0, 6);
  try{ localStorage.setItem(KEY, JSON.stringify(r)); }catch(e){}
  renderRecent();
}
function renderRecent(){
  const r = getRecent().map(n => TOOLS.find(t => t.name === n)).filter(Boolean);
  const box = $("#recent");
  if(!r.length){ box.innerHTML = ""; return; }
  box.innerHTML = '<div class="sec-t">最近使用</div><div class="recent-row">' +
    r.map(t => `<a class="rc" href="${t.url}" target="_blank" rel="noopener">
      <i style="background:${t.g};--gl:${glow(t.g)}"><svg viewBox="0 0 24 24"><use href="#${t.icon}"/></svg></i>${t.name}</a>`).join("") +
    "</div>";
}

/* ---- 筛选 chips ---- */
let curCat = "全部";
function renderFilters(){
  $("#filters").innerHTML = ["全部", ...CATS].map(c =>
    `<button class="chip${c === curCat ? " on" : ""}" data-cat="${c}">${c}</button>`
  ).join("");
  $("#filters").querySelectorAll(".chip").forEach(b => {
    b.onclick = () => { curCat = b.dataset.cat; renderFilters(); render(); };
  });
}

/* ---- 卡片 ---- */
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const show = TOOLS.filter(t =>
    (curCat === "全部" || t.cat === curCat) &&
    (!q || (t.name + t.desc + t.cat).toLowerCase().includes(q))
  );

  const groups = CATS.filter(c => curCat === "全部" || c === curCat)
    .map(c => ({ c, items: show.filter(t => t.cat === c) }))
    .filter(g => g.items.length);

  $("#list").innerHTML = groups.map(g => `
    <section>
      <div class="sec-h">
        <span class="bar" style="background:${CAT_COLOR[g.c]}"></span>
        <h2>${g.c}</h2><span class="count">${g.items.length}</span>
      </div>
      <div class="grid">${g.items.map(t => `
        <a class="card${t.live ? "" : " archived"}" href="${t.url}" target="_blank" rel="noopener" data-name="${t.name}">
          ${t.tag ? `<span class="tag">${t.tag}</span>` : ""}
          <div class="ic" style="background:${t.g};--gl:${glow(t.g)}"><svg viewBox="0 0 24 24"><use href="#${t.icon}"/></svg></div>
          <div class="card-body">
            <h3>${t.name}<span class="arrow">↗</span></h3>
            <p>${t.desc}</p>
            <div class="meta">
              <span class="dot ${t.live ? "live" : "arch"}"></span>
              <span class="url">${t.host}</span>
            </div>
          </div>
        </a>`).join("")}
      </div>
    </section>`).join("");

  $("#empty").classList.toggle("hidden", show.length > 0);
  $("#cnt2").textContent = show.length;

  $("#list").querySelectorAll(".card").forEach(a => {
    a.addEventListener("click", () => markRecent(a.dataset.name));
  });
}

/* ---- 顶部统计 ---- */
$("#s-total").textContent = TOOLS.length;
$("#s-cat").textContent = CATS.length;
$("#s-live").textContent = TOOLS.filter(t => t.live && t.host !== "本站").length;

/* ---- 事件 ---- */
$("#q").addEventListener("input", render);
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
  if(e.key === "Escape" && document.activeElement === $("#q")){
    $("#q").value = ""; $("#q").blur(); render();
  }
});

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

renderFilters();
render();
renderRecent();
</script>
</body>
</html>
