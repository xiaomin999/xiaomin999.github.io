const CATS = [...new Set(TOOLS.map(t => t.cat))];
const KEY = "hub_recent_v1";
const $ = s => document.querySelector(s);

/* ---- 最近使用 ---- */
function getRecent(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; }
}
function markRecent(name){
  let r = getRecent().filter(n => n !== name);
  r.unshift(name);
  r = r.slice(0, 6);
  try{ localStorage.setItem(KEY, JSON.stringify(r)); }catch(e){}
  renderRecent();
}
function renderRecent(){
  const r = getRecent().map(n => TOOLS.find(t => t.name === n)).filter(Boolean);
  const box = $("#recent");
  if(!r.length){ box.innerHTML = ""; return; }
  box.innerHTML = '<div class="sec-t">最近使用</div><div class="recent-row">' +
    r.map(t => `<a class="rc" href="${t.url}" target="_blank" rel="noopener">
      <i style="background:${t.g}"><svg viewBox="0 0 24 24"><use href="#${t.icon}"/></svg></i>${t.name}</a>`).join("") +
    "</div>";
}

/* ---- 筛选 chips ---- */
let curCat = "全部";
function renderFilters(){
  $("#filters").innerHTML = ["全部", ...CATS].map(c =>
    `<button class="chip${c === curCat ? " on" : ""}" data-cat="${c}">${c}</button>`
  ).join("");
  $("#filters").querySelectorAll(".chip").forEach(b => {
    b.onclick = () => { curCat = b.dataset.cat; renderFilters(); render(); };
  });
}

/* ---- 卡片 ---- */
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const show = TOOLS.filter(t =>
    (curCat === "全部" || t.cat === curCat) &&
    (!q || (t.name + t.desc + t.cat).toLowerCase().includes(q))
  );

  const groups = CATS.filter(c => curCat === "全部" || c === curCat)
    .map(c => ({ c, items: show.filter(t => t.cat === c) }))
    .filter(g => g.items.length);

  $("#list").innerHTML = groups.map(g => `
    <section>
      <div class="sec-h"><h2>${g.c}</h2><span>${g.items.length} 个</span></div>
      <div class="grid">${g.items.map(t => `
        <a class="card${t.live ? "" : " archived"}" href="${t.url}" target="_blank" rel="noopener" data-name="${t.name}">
          ${t.tag ? `<span class="tag">${t.tag}</span>` : ""}
          <div class="ic" style="background:${t.g}"><svg viewBox="0 0 24 24"><use href="#${t.icon}"/></svg></div>
          <h3>${t.name}</h3>
          <p>${t.desc}</p>
          <div class="meta">
            <span class="dot ${t.live ? "live" : "arch"}"></span>
            <span class="url">${t.host}</span>
          </div>
        </a>`).join("")}
      </div>
    </section>`).join("");

  $("#empty").classList.toggle("hidden", show.length > 0);
  $("#cnt").textContent = show.length;
  $("#cnt2").textContent = show.length;

  $("#list").querySelectorAll(".card").forEach(a => {
    a.addEventListener("click", () => markRecent(a.dataset.name));
  });
}

/* ---- 事件 ---- */
$("#q").addEventListener("input", render);
document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); }
  if(e.key === "Escape" && document.activeElement === $("#q")){
    $("#q").value = ""; $("#q").blur(); render();
  }
});

if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

renderFilters();
render();
renderRecent();
</script>
