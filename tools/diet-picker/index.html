<title>今天吃什么 · 减脂版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F7F4; --card:#FFFFFF; --line:#E8ECE7;
  --tx:#1B211C; --tx2:#6B776E; --tx3:#9AA5A0;
  --g:#2E9E5B; --g-l:#E8F5ED; --o:#FF8A3D; --o-l:#FFF1E6;
  --r:#E5484D; --r-l:#FDECEC;
  --sh:0 1px 2px rgba(16,32,20,.04), 0 6px 20px rgba(16,32,20,.06);
}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.5; padding-bottom:calc(28px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}

/* header */
header{padding:22px 0 12px}
.h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
h1{font-size:23px;font-weight:800;margin:0;letter-spacing:-.3px}
h1 .dot{color:var(--g)}
.sub{color:var(--tx2);font-size:12.5px;margin-top:5px}
.icon-btn{
  width:38px;height:38px;border:1px solid var(--line);background:var(--card);border-radius:12px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;flex:none;
}
.icon-btn:active{transform:scale(.94)}

/* progress */
.prog{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--sh)}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
.prog-k{font-size:22px;font-weight:800;letter-spacing:-.5px}
.prog-k span{font-size:12px;font-weight:600;color:var(--tx3);margin-left:3px}
.prog-r{font-size:12px;color:var(--tx2)}
.bar{height:7px;background:#EEF2EE;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4CB87A,var(--g));border-radius:99px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.bar.warn i{background:linear-gradient(90deg,#FFA76B,var(--o))}
.bar.over i{background:linear-gradient(90deg,#FF7A7E,var(--r))}
.macro{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--tx2)}
.macro b{color:var(--tx);font-weight:700}
.macro i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:4px}

/* mode + meals */
.seg{display:flex;background:#EDF1ED;padding:3px;border-radius:13px;margin:14px 0 10px}
.seg button{
  flex:1;border:0;background:transparent;padding:10px 4px;border-radius:11px;font-size:14px;font-weight:700;
  color:var(--tx2);cursor:pointer;font-family:inherit;transition:.18s;
}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(16,32,20,.1)}
.meals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.meal{
  background:var(--card);border:1px solid var(--line);border-radius:15px;padding:11px 4px;text-align:center;
  cursor:pointer;transition:.18s;position:relative;
}
.meal .em{font-size:19px;line-height:1.2}
.meal .nm{font-size:12.5px;font-weight:700;margin-top:3px}
.meal .kc{font-size:10.5px;color:var(--tx3);margin-top:2px;font-variant-numeric:tabular-nums}
.meal.on{border-color:var(--g);background:var(--g-l);box-shadow:0 0 0 2.5px rgba(46,158,91,.13)}
.meal.on .nm{color:var(--g)}
.meal.done::after{content:'';position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--g)}

/* roll btn */
.roll{
  width:100%;border:0;border-radius:17px;padding:16px;font-size:16.5px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#3EB06B,#249155);cursor:pointer;font-family:inherit;
  box-shadow:0 6px 18px rgba(36,145,85,.28);transition:.15s;letter-spacing:.5px;
}
.roll:active{transform:translateY(1px) scale(.99);box-shadow:0 3px 10px rgba(36,145,85,.24)}
.roll.shaking{animation:shake .28s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* result */
.res{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px 15px;box-shadow:var(--sh);
  display:flex;align-items:center;gap:12px;animation:pop .34s cubic-bezier(.2,1.1,.4,1) backwards;
}
@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.98)}}
.tag{
  font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:7px;flex:none;letter-spacing:.3px;
  background:var(--g-l);color:var(--g);
}
.tag.o{background:var(--o-l);color:#D96B1E}
.tag.b{background:#EAF2FD;color:#3B74C4}
.card .mid{flex:1;min-width:0}
.card .nm{font-weight:700;font-size:15.5px;letter-spacing:-.2px}
.card .kc{font-size:12px;color:var(--tx2);margin-top:3px;font-variant-numeric:tabular-nums}
.card .kc b{color:var(--o);font-weight:800}
.card .tip{font-size:11.5px;color:var(--tx3);margin-top:4px;line-height:1.45}
.acts{display:flex;flex-direction:column;gap:6px;flex:none}
.acts button{
  width:32px;height:32px;border:1px solid var(--line);background:#FAFBFA;border-radius:10px;cursor:pointer;
  font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;transition:.15s;
}
.acts button:active{transform:scale(.9)}
.acts .x:active{background:var(--r-l);border-color:#F5C6C7}
.spin{animation:flip .1s infinite}
@keyframes flip{50%{opacity:.45}}

/* combo total */
.total{
  background:linear-gradient(135deg,#F0F8F3,#E7F4EC);border:1px solid #D6EBDF;border-radius:17px;
  padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:4px;
}
.total .lb{font-size:12px;color:#3D6B4E;font-weight:700}
.total .v{font-size:25px;font-weight:800;color:var(--g);letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.total .v span{font-size:12px;font-weight:700;margin-left:2px}
.total .sub2{font-size:11px;color:#5F8A6E;margin-top:2px;font-weight:600}

/* out mode: order script */
.script{background:#FFFDF6;border:1px solid #F3E4C4;border-radius:15px;padding:13px 15px;
  font-size:13px;line-height:1.65;color:#6B5426}
.script .hd{font-weight:800;color:#9A7420;font-size:12px;margin-bottom:5px;letter-spacing:.3px}

.empty{text-align:center;padding:40px 20px;color:var(--tx3);font-size:13.5px;line-height:1.8}
.empty .big{font-size:40px;margin-bottom:10px}

/* bottom bar */
.bot{display:flex;gap:9px;margin-top:14px}
.bot button{
  flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;
  font-size:13.5px;font-weight:700;color:var(--tx2);cursor:pointer;font-family:inherit;transition:.15s;
}
.bot button:active{transform:scale(.98)}
.bot button.pri{background:var(--tx);color:#fff;border-color:var(--tx)}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(15,25,18,.42);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;background:var(--card);z-index:50;
  border-radius:24px 24px 0 0;padding:8px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .32s cubic-bezier(.3,1,.4,1);
  max-width:520px;margin:0 auto;max-height:86vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;background:#DDE3DE;border-radius:99px;margin:6px auto 14px}
.sh-t{font-size:17px;font-weight:800;margin-bottom:4px}
.sh-d{font-size:12.5px;color:var(--tx2);margin-bottom:16px;line-height:1.6}
.fld{margin-bottom:15px}
.fld label{display:block;font-size:12.5px;font-weight:700;color:var(--tx2);margin-bottom:7px}
.fld input{
  width:100%;border:1px solid var(--line);background:#FAFBFA;border-radius:12px;padding:12px 14px;
  font-size:15px;font-family:inherit;color:var(--tx);
}
.fld input:focus{outline:0;border-color:var(--g);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  border:1px solid var(--line);background:#FAFBFA;border-radius:99px;padding:8px 13px;font-size:13px;
  cursor:pointer;font-family:inherit;color:var(--tx2);transition:.15s;
}
.chip.on{background:var(--g-l);border-color:var(--g);color:var(--g);font-weight:700}
.blk{display:flex;flex-wrap:wrap;gap:7px}
.blk .chip{border-style:dashed;color:var(--r);border-color:#F2C9CA}
.blk .chip::after{content:' ✕';font-size:10px}
.save{
  width:100%;border:0;background:var(--g);color:#fff;border-radius:14px;padding:14px;font-size:15.5px;
  font-weight:800;cursor:pointer;font-family:inherit;margin-top:4px;
}
.note{font-size:11px;color:var(--tx3);line-height:1.65;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:rgba(27,33,28,.94);color:#fff;
  padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
  transition:.25s;z-index:70;max-width:88vw;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

/* ============ 状态 ============ */
const K = 'dietpicker.v1';
let S = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(K));
    if(s && s.t) return Object.assign({t:1400, mode:'home', cur:'breakfast', pick:{}, block:[], avoid:[]}, s);
  }catch(e){}
  return {t:1400, mode:'home', cur:'breakfast', pick:{}, block:[], avoid:[]};
}
const save = ()=>localStorage.setItem(K, JSON.stringify(S));

/* ============ 工具 ============ */
const $ = id=>document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const sum = a => a.reduce((x,y)=>x+y,0);
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._); e._=setTimeout(()=>e.classList.remove('on'),1900); }
function blocked(n){ return S.block.includes(n); }
function hitAvoid(x){ return (S.avoid||[]).some(t=>(x.tags||[]).includes(t)); }
function pool(arr){
  const all = arr.map(raw);
  let f = all.filter(x=>!blocked(x.n) && !hitAvoid(x));
  if(!f.length) f = all.filter(x=>!blocked(x.n));   // 忌口太严时降级
  return f.length?f:all;
}
function filteredCount(){
  const av=S.avoid||[]; if(!av.length) return 0;
  let n=0;
  ['breakfast','lunch','dinner'].forEach(m=>['carb','protein','veg','drink'].forEach(sl=>
    HOME[m][sl].forEach(a=>{ if(av.some(t=>raw(a).tags.includes(t))) n++; })));
  ['breakfast','lunch','dinner'].forEach(m=>OUT[m].forEach(a=>{ if(av.some(t=>raw(a).tags.includes(t))) n++; }));
  SNACK.forEach(a=>{ if(av.some(t=>raw(a).tags.includes(t))) n++; });
  return n;
}

/* ============ 渲染 ============ */
function renderMeals(){
  $('meals').innerHTML = MEALS.map(m=>{
    const p = S.pick[m.id];
    const kc = p ? Math.round(sum(p.map(x=>x.k))) : Math.round(S.t*m.rate);
    return `<div class="meal ${S.cur===m.id?'on':''} ${p?'done':''}" onclick="setMeal('${m.id}')">
      <div class="em">${m.em}</div><div class="nm">${m.nm}</div><div class="kc">${kc} kcal</div></div>`;
  }).join('');
}

  let k=0,p=0,c=0,f=0;
  MEALS.forEach(m=>{ (S.pick[m.id]||[]).forEach(x=>{k+=x.k;p+=x.p;c+=x.c;f+=x.f;}); });
  k=Math.round(k);
  $('pK').textContent=k; $('pT').textContent=S.t;
  $('pR').textContent = k>S.t ? `超出 ${k-S.t}` : `还剩 ${S.t-k}`;
  const r = k/S.t;
  const bar=$('pBar');
  bar.className='bar'+(k>S.t?' over':(r>.85?' warn':''));
  bar.firstElementChild.style.width=Math.min(100,r*100)+'%';
  $('mP').textContent=Math.round(p); $('mC').textContent=Math.round(c); $('mF').textContent=Math.round(f);
}

function cardHTML(x, slot, i){
  return `<div class="card" style="animation-delay:${i*60}ms">
    <div class="tag ${SLOT_CLS[slot]||''}">${SLOT_NM[slot]}</div>
    <div class="mid">
      <div class="nm">${x.n}</div>
      <div class="kc"><b>${x.k}</b> kcal · 蛋白 ${x.p}g · 碳水 ${x.c}g · 脂肪 ${x.f}g</div>
      ${x.tip?`<div class="tip">💡 ${x.tip}</div>`:''}
    </div>
    <div class="acts">
      <button onclick="swap('${slot}')" title="换一个">↻</button>
      <button class="x" onclick="block('${x.n.replace(/'/g,"")}')" title="不想吃">✕</button>
    </div>
  </div>`;
}

function renderRes(){
  const p = S.pick[S.cur];
  const box = $('res');
  if(!p || !p.length){
    box.innerHTML = `<div class="empty"><div class="big">${S.mode==='out'?'🛵':'🍽️'}</div>
      还没选${MEALS.find(m=>m.id===S.cur).nm}<br>点上面按钮，我帮你抽</div>`;
    return;
  }
  let h='';
  if(S.mode==='out' && S.cur!=='snack'){
    const x=p[0];
    h += `<div class="card" style="animation-delay:0ms">
      <div class="mid"><div class="nm" style="font-size:16.5px">${x.n}</div>
      <div class="kc"><b>${x.k}</b> kcal · 蛋白 ${x.p}g · 碳水 ${x.c}g · 脂肪 ${x.f}g</div></div>
      <div class="acts"><button onclick="swap('all')">↻</button>
      <button class="x" onclick="block('${x.n.replace(/'/g,"")}')">✕</button></div></div>
      ${x.tip?`<div class="script"><div class="hd">📝 点单这样说</div>${x.tip}</div>`:''}`;
  }else{
    h = p.map((x,i)=>cardHTML(x,x.slot,i)).join('');
  }
  const k=Math.round(sum(p.map(x=>x.k)));
  const tgt=Math.round(S.t*MEALS.find(m=>m.id===S.cur).rate);
  const d=k-tgt;
  h += `<div class="total"><div><div class="lb">本餐合计</div>
    <div class="sub2">${d>60?'比建议多 '+d+' kcal':(d<-60?'比建议少 '+(-d)+' kcal':'正好在建议范围内')}（建议 ${tgt}）</div></div>
    <div class="v">${k}<span>kcal</span></div></div>`;
  box.innerHTML=h;
}

function render(){
  renderMeals(); renderProg(); renderRes();
  $('mHome').classList.toggle('on', S.mode==='home');
  $('mOut').classList.toggle('on', S.mode==='out');
  $('rollBtn').textContent = S.cur==='snack' ? '🍎 抽个加餐' : '🎲 帮我决定';
}

/* ============ 抽签 ============ */
function combos(meal){
  const src = HOME[meal];
  const P = {carb:pool(src.carb), protein:pool(src.protein), veg:pool(src.veg), drink:pool(src.drink)};
  const out=[];
  for(let i=0;i<80;i++){
    const c=[];
    ['carb','protein','veg','drink'].forEach(s=>{ const x=pick(P[s]); c.push(Object.assign({slot:s},x)); });
    out.push(c);
  }
  return out;
}
function best(list, tgt){
  const scored = list.map(c=>({c, d:Math.abs(sum(c.map(x=>x.k))-tgt)})).sort((a,b)=>a.d-b.d);
  return pick(scored.slice(0, Math.min(10, scored.length))).c;
}

let shaking=false;
function roll(){
  if(shaking) return; shaking=true;
  const b=$('rollBtn'); b.classList.add('shaking');
  setTimeout(()=>b.classList.remove('shaking'),300);

  let n=0;
  const t = setInterval(()=>{
    try{
      const m = MEALS.find(x=>x.id===S.cur);
      const tgt = S.t*m.rate;
      if(S.cur==='snack'){
        S.pick.snack = [Object.assign({slot:'snack'}, pick(pool(SNACK)))];
      }else if(S.mode==='out'){
        S.pick[S.cur] = [Object.assign({slot:'all'}, pick(pool(OUT[S.cur])))];
      }else{
        S.pick[S.cur] = best(combos(S.cur), tgt);
      }
      renderRes();
    }catch(e){ console.error(e); }
    if(++n>=7){ clearInterval(t); shaking=false; try{ render(); }catch(e){ console.error(e); } }
  }, 85);
}

function swap(slot){
  const m = S.cur, cur = S.pick[m];
  if(!cur) return;
  if(S.cur==='snack'){ S.pick.snack=[Object.assign({slot:'snack'}, pick(pool(SNACK)))]; render(); return; }
  if(S.mode==='out'){ S.pick[m]=[Object.assign({slot:'all'}, pick(pool(OUT[m])))]; render(); return; }
  const src = HOME[m];
  let ok=null, guard=0;
  while(!ok && guard++<60){
    const x = pick(pool(src[slot]));
    if(x.n !== cur.find(c=>c.slot===slot).n) ok = Object.assign({slot}, x);
  }
  if(ok) S.pick[m] = cur.map(c=>c.slot===slot?ok:c);
  save(); render();
}

function block(name){
  if(!S.block.includes(name)) S.block.push(name);
  const m=S.cur, cur=S.pick[m]||[];
  S.pick[m] = cur.filter(x=>x.n!==name);
  // 拉黑后自动补一个
  const hit = cur.find(x=>x.n===name);
  if(S.pick[m].length && S.pick[m].length < cur.length){
    if(S.mode==='out' && m!=='snack') S.pick[m] = [Object.assign({slot:'all'}, pick(pool(OUT[m])))];
    else if(m!=='snack' && hit){
      const sl = hit.slot;
      const x = pick(pool(HOME[m][sl]));
      S.pick[m].push(Object.assign({slot:sl}, x));
      const order = {carb:0,protein:1,veg:2,drink:3};
      S.pick[m].sort((a,b)=>order[a.slot]-order[b.slot]);
    }
  }
  if(!S.pick[m].length) delete S.pick[m];
  save(); render(); toast('已拉黑「'+name+'」，不会再抽到');
}

function setMeal(id){ S.cur=id; save(); render(); }
function setMode(m){ S.mode=m; delete S.pick[S.cur]; save(); render(); }
function clearMeal(){ delete S.pick[S.cur]; save(); render(); toast('已重置'); }

function copyDay(){
  const L=[];
  MEALS.forEach(m=>{
    const p=S.pick[m.id];
    if(p&&p.length){
      L.push(`【${m.nm}】${p.map(x=>x.n).join(' + ')}  (${Math.round(sum(p.map(x=>x.k)))} kcal)`);
      const tp=p.map(x=>x.tip).filter(Boolean);
      if(tp.length) L.push('   · '+tp.join('；'));
    }
  });
  if(!L.length){ toast('还没有选择任何餐次'); return; }
  const k=Math.round(MEALS.reduce((a,m)=>a+sum((S.pick[m.id]||[]).map(x=>x.k)),0));
  const txt = `今日菜单（合计 ${k} kcal / 目标 ${S.t}）\n`+L.join('\n');
  const done = ()=>toast('已复制，去粘贴吧');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallback(txt,done));
  } else fallback(txt,done);
}
function fallback(txt,cb){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity=0;
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

/* ============ 设置 ============ */
function openSet(){
  $('iT').value=S.t;
  $('quickT').innerHTML=[1200,1400,1600,1800,2000].map(v=>
    `<button class="chip ${S.t===v?'on':''}" onclick="$('iT').value=${v};qset(${v})">${v}</button>`).join('');
  $('avoidList').innerHTML = AVOID.map(a=>
    `<button class="chip ${(S.avoid||[]).includes(a.id)?'on':''}" onclick="togAvoid('${a.id}')">${a.nm}</button>`).join('');
  $('blkList').innerHTML = S.block.length
    ? S.block.map(n=>`<button class="chip" onclick="unblock('${n.replace(/'/g,'')}')">${n}</button>`).join('')
    : '<span style="font-size:12.5px;color:var(--tx3)">还没有，点卡片右上角 ✕ 可以拉黑不想吃的</span>';
  const fc = filteredCount();
  $('note').innerHTML = (fc?`当前忌口已屏蔽 <b style="color:var(--g)">${fc}</b> 道菜。`:'')
    + '拉黑的菜不会再被抽到。换手机或用无痕模式会丢失记录，正常浏览器会一直记住。';
  $('mask').classList.add('on'); $('sheet').classList.add('on');
}
function qset(v){ [...$('quickT').children].forEach(b=>b.classList.toggle('on', b.textContent==v)); }
function togAvoid(id){
  S.avoid = S.avoid||[];
  const i = S.avoid.indexOf(id);
  if(i>=0) S.avoid.splice(i,1); else S.avoid.push(id);
  // 已选的菜若撞上忌口，直接清掉重抽
  MEALS.forEach(m=>{
    if(S.pick[m.id]) S.pick[m.id] = S.pick[m.id].filter(x=>!hitAvoid(x));
    if(S.pick[m.id] && !S.pick[m.id].length) delete S.pick[m.id];
  });
  save(); render(); openSet();
}
function closeSet(){ $('mask').classList.remove('on'); $('sheet').classList.remove('on'); }
function saveSet(){
  const v=parseInt($('iT').value,10);
  if(v&&v>=800&&v<=4000) S.t=v;
  save(); render(); closeSet(); toast('已保存');
}
function unblock(n){ S.block=S.block.filter(x=>x!==n); save(); openSet(); }

render();
</script>
