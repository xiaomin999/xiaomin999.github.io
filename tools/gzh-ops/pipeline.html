<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>公众号创作流水线 · 7步出稿</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#242424; --muted:#7a8290;
    --line:#e7e9ee; --accent:#2b6cb0; --accent-soft:#e8f0fc; --accent-ink:#1b3a5b;
    --red:#c62828; --green:#2f9e6b; --amber:#e08a00; --radius:14px;
    --shadow:0 1px 3px rgba(20,30,50,.06),0 6px 20px rgba(20,30,50,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
    padding:12px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line)}
  .topbar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.5px}
  .topbar .sub{font-size:11.5px;color:var(--muted)}
  .topbar .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
  .pill.demo{background:#fff3e0;color:var(--amber)}
  .pill.live{background:#e7f6ee;color:var(--green)}
  .btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:600;
    padding:9px 14px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:.15s}
  .btn:hover{filter:brightness(1.05)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:#fff;color:var(--accent);}
  .btn.soft{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .btn.mini{padding:4px 9px;font-size:12px;border-radius:7px}
  .icon-btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--muted);
    width:36px;height:36px;border-radius:9px;cursor:pointer;font-size:16px}
  .icon-btn:hover{color:var(--accent);border-color:var(--accent)}
  .back-link{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;
    color:var(--accent-ink);background:var(--accent-soft);border:1px solid #cfe0f7;
    padding:7px 12px;border-radius:9px;text-decoration:none;white-space:nowrap;transition:.15s}
  .back-link:hover{background:#dbe8fa}

  /* stepper */
  .stepper{display:flex;gap:6px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none}
  .stepper::-webkit-scrollbar{display:none}
  .step{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;
    padding:8px 6px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:.15s}
  .step .em{font-size:20px;line-height:1;filter:grayscale(.3)}
  .step .nm{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap}
  .step.active{background:var(--accent-soft);border-color:#cfe0f7}
  .step.active .nm{color:var(--accent-ink)}
  .step.done .em::after{content:"✓";font-size:10px;background:var(--green);color:#fff;border-radius:50%;
    padding:1px 4px;margin-left:2px;vertical-align:top}
  .step.locked{opacity:.55}

  .wrap{max-width:920px;margin:0 auto;padding:14px 18px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .card .st{font-size:15px;font-weight:700;margin:0 0 4px}
  .card .st .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--accent);
    color:#fff;font-size:12px;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle}
  .muted{color:var(--muted)}
  .hint{font-size:12.5px;color:var(--muted);margin:4px 0 12px}
  label.field{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input.field,textarea.field,select.field{width:100%;border:1px solid var(--line);border-radius:9px;
    padding:9px 11px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea.field{resize:vertical;min-height:88px;line-height:1.6}
  input.field:focus,textarea.field:focus,select.field:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .row.end{justify-content:flex-end}
  .spacer{flex:1}

  .item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .item.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .item .top{display:flex;align-items:center;gap:8px}
  .item .title{font-weight:700;font-size:14.5px}
  .item .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600}
  .badge.候选{background:#eef2f7;color:#5a6675}
  .badge.采纳{background:#e7f6ee;color:var(--green)}
  .badge.弃用{background:#fdecec;color:var(--red)}
  .mc{margin:6px 0 0;padding-left:18px;font-size:13px}
  .mc li{margin:2px 0}
  .tag{display:inline-block;font-size:11px;background:var(--accent-soft);color:var(--accent-ink);
    padding:1px 7px;border-radius:6px;margin-right:4px}
  .empty{border:1.5px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted);font-size:13px}

  .spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.5);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:5px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;
    pointer-events:none;transition:.25s;z-index:60;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(20,30,50,.35);z-index:50;display:none}
  .mask.show{display:block}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,92vw);
    background:#fff;border-radius:16px;padding:20px;z-index:51;box-shadow:var(--shadow);display:none}
  .modal.show{display:block}
  .modal h3{margin:0 0 12px;font-size:16px}
  .presets{display:flex;gap:6px;margin:6px 0 0;flex-wrap:wrap}
  .preset{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
  .preset:hover{border-color:var(--accent);color:var(--accent)}
  .navlink{color:var(--accent);cursor:pointer;font-weight:600}
  .navlink:hover{text-decoration:underline}
  .upbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .ok{color:var(--green)}

  /* Phase B 新增样式 */
  .paper{background:#fcfcfe;border:1px solid var(--line);border-radius:10px;padding:14px 16px;line-height:1.85;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
  .annot{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  .annot .seg{font-size:13.5px;flex:1}
  .badge.新增{background:#e7f6ee;color:var(--green)}
  .badge.改写{background:#fff3e0;color:var(--amber)}
  .risk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--line)}
  .risk:last-child{border-bottom:none}
  .lvl{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;flex:0 0 auto;margin-top:1px}
  .lvl.高{background:#fdecec;color:var(--red)} .lvl.中{background:#fff3e0;color:var(--amber)} .lvl.低{background:#eef2f7;color:#5a6675}
  .rbody{flex:1} .rt{font-weight:600;font-size:13.5px}
  .oview{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
  .ov{flex:1;min-width:88px;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .ov .num{display:block;font-size:22px;font-weight:800;color:var(--accent-ink)} .ov .lbl{font-size:12px;color:var(--muted)}
  .bar{height:12px;background:#eef2f7;border-radius:999px;overflow:hidden;margin:6px 0}
  .barfill{height:100%;border-radius:999px;transition:width .4s}
  .wxprev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;max-width:680px;margin:0 auto}
  .wxprev h1,.wxprev h2{margin-top:0}
</style>
</head>
<body>
<div class="topbar">
  <a class="back-link" href="index.html" title="返回门户">← 门户</a>
  <div>
    <h1>公众号创作流水线</h1>
    <div class="sub">7 步出稿 · 题材→爆款→选题→润色→合规→排版→封面</div>
  </div>
  <div class="spacer"></div>
  <span id="aiStatus" class="pill demo">DEMO</span>
  <button class="icon-btn" id="syncBtn" title="云同步">☁️</button>
  <button class="icon-btn" id="setBtn" title="AI 设置">⚙️</button>
</div>

<div class="stepper" id="stepper"></div>

<div class="wrap">
  <div id="syncbar" class="card" style="display:none">
    <div class="st">☁️ 云同步（与主站共用 Supabase）</div>
    <div class="hint">同步码与主站一致即可多端共享数据。上传＝合并后推云端；下载＝把云端合并回本地（不覆盖本地独有内容）。</div>
    <div class="row">
      <input class="field" id="syncKey" placeholder="输入同步码（与主站相同）" style="max-width:240px" />
      <button class="btn sm" id="syncUp">⬆ 上传</button>
      <button class="btn sm ghost" id="syncDown">⬇ 下载</button>
      <button class="btn sm soft" id="syncExp">导出</button>
      <button class="btn sm soft" id="syncImp">导入</button>
      <input type="file" id="syncFile" accept=".json" style="display:none" />
    </div>
    <div id="syncStatus" class="upbar" style="margin-top:8px"></div>
  </div>

  <div id="content"></div>
</div>

<!-- settings modal -->
<div class="mask" id="setMask"></div>
<div class="modal" id="setModal">
  <h3>⚙️ AI 接入（与主站共用 gzh_ai）</h3>
  <div class="hint">填了密钥即用真实模型；留空则全程 DEMO 示例。配置会自动同步给主站《公众号助推助手》。</div>
  <label class="field">接口地址（完整 chat/completions URL）</label>
  <input class="field" id="setEndpoint" placeholder="https://api.openai.com/v1/chat/completions" />
  <div class="presets">
    <span class="preset" data-p="deepseek">DeepSeek</span>
    <span class="preset" data-p="qwen">通义千问</span>
    <span class="preset" data-p="openai">OpenAI</span>
  </div>
  <label class="field">API Key</label>
  <input class="field" id="setKey" type="password" placeholder="sk-..." />
  <label class="field">模型名</label>
  <input class="field" id="setModel" placeholder="deepseek-chat" />
  <div class="row" style="margin-top:14px">
    <button class="btn" id="setSave">保存</button>
    <button class="btn ghost" id="setClose">关闭</button>
    <span id="setMsg" class="muted"></span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ 数据层（复用主站 gzh_ 前缀；pipeline 数据用 gzh_pipe_*） ============ */
const PS = {
  get(k,def){ try{ const v=localStorage.getItem('gzh_'+k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ localStorage.setItem('gzh_'+k, JSON.stringify(v)); },
  del(k){ localStorage.removeItem('gzh_'+k); }
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ============ AI 客户端（读主站 gzh_ai） ============ */
function aiCfg(){ return PS.get('ai',{endpoint:'',key:'',model:''}); }
function aiLive(){ const c=aiCfg(); return !!(c.endpoint&&c.key&&c.model); }
function refreshAiStatus(){
  const el=$('#aiStatus');
  if(aiLive()){ el.textContent='AI 已接入'; el.className='pill live'; }
  else { el.textContent='DEMO 模式'; el.className='pill demo'; }
}
async function pipeChat(system,user,temp,demoFn){
  temp=temp||0.7; const c=aiCfg();
  if(!aiLive()) return (demoFn||pipeDemo)(system,user);
  try{
    const r=await fetch(c.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:JSON.stringify({model:c.model,temperature:temp,messages:[{role:'system',content:system},{role:'user',content:user}]})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    return (j.choices&&j.choices[0]&&j.choices[0].message.content)||'';
  }catch(e){ toast('接口失败，已回退 DEMO：'+e.message); return pipeDemo(system,user); }
}
function pipeDemo(system,user){
  const genre=(user.match(/题材[：:]\s*(.+)/)||[])[1]||'你的题材';
  const srcRaw=(user.match(/竞品素材[：:]\s*([\s\S]*)/)||[])[1]||'';
  const src=srcRaw.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5);
  const base=[
    {title:`「${genre}」别等准备好了：先做完这 3 件小事`,
     mainContent:['从你自己的起步犹豫写起，制造真实反差','给 3 个今天就能做的最小动作','结尾留一个可立刻照做的召唤'],
     angle:'第一人称真实经历 + 反差钩子', whyHot:'命中「真实经历 + 具体数字 + 行动召唤」爆款因子',
     source: src.length?('参考你粘贴的：'+src[0]):'DEMO 生成（接入 API 后基于真实竞品）'},
    {title:`一个人做 ${genre} 一年没起色，换个方法 30 天翻盘`,
     mainContent:['对比「断更期」与「方法升级后」的每天流程','把可复制的清单落成步骤','用具体时间/数字增强可信'],
     angle:'痛点共鸣 + 具体数字', whyHot:'痛点+数字组合，点击率更高',
     source: src.length?('参考：'+src.slice(-1)[0]):'DEMO 生成'},
    {title:`8:30 的书桌、写作业的娃、和一篇发出去的 ${genre} 文章`,
     mainContent:['把「每天坐下来」的仪式感写成画面','给读者一个同款节奏模板','结尾点出坚持本身的价值'],
     angle:'画面感 + 情绪共鸣', whyHot:'场景化开头，手机阅读友好', source:'DEMO 生成'}
  ];
  return JSON.stringify(base,null,2);
}

/* ============ 解析 AI 返回的 JSON 数组 ============ */
function parseJsonArr(t){
  t=(t||'').replace(/```json|```/g,'').trim();
  try{ const j=JSON.parse(t); if(Array.isArray(j)) return j; if(j&&Array.isArray(j.topics)) return j.topics; }catch(e){}
  const s=t.indexOf('['), e=t.lastIndexOf(']');
  if(s>=0&&e>s){ try{ return JSON.parse(t.slice(s,e+1)); }catch(e2){} }
  return [];
}

/* ============ 解析 AI 返回的 JSON 对象 ============ */
function parseJsonObj(t){
  t=(t||'').replace(/```json|```/g,'').trim();
  try{ const j=JSON.parse(t); if(j&&typeof j==='object'&&!Array.isArray(j)) return j; }catch(e){}
  const s=t.indexOf('{'), e=t.lastIndexOf('}');
  if(s>=0&&e>s){ try{ return JSON.parse(t.slice(s,e+1)); }catch(e2){} }
  return null;
}

/* ============ DEMO：润色 / 检查（无 API 时示例输出） ============ */
function demoPolish(system,user){
  const orig=(user.match(/初稿：\n([\s\S]*)/)||[])[1]||'（示例初稿）你今天想聊聊减肥这件事。';
  const polished='（DEMO 成稿示例）\n\n八点半的书桌前，娃在写作业，我盯着碗里的半根玉米——这就是我普通一天里最真实的「减肥现场」。\n\n今天不想讲大道理，就聊一件小事：把晚餐的主食换成半根玉米。上周我称量停在 63.5kg，没靠饿，就靠这种不费力的替换。\n\n很多人卡在「开始」两个字。其实不用等准备好了，今晚先把这一顿换掉，就算你开始了。';
  const annotations=[
    {type:'改写',segment:'原开头「你今天想聊聊减肥这件事」',reason:'改为画面化场景切入，前 3 秒抓住读者'},
    {type:'新增',segment:'补充「称量 63.5kg」的真实数字',reason:'用具体数据增强可信与真实感'},
    {type:'新增',segment:'结尾行动召唤「今晚先换一顿」',reason:'给读者一个低门槛的下一步'}
  ];
  return JSON.stringify({polished,annotations,summary:'主要做了场景化开头 + 两处真实细节补充，未改变核心观点。'});
}
function demoCheck(system,user){
  return JSON.stringify({
    copyright:[{level:'中',point:'开头「30天瘦8斤」式数字钩子与同类爆款结构相似',detail:'数字+天数钩子在同类文中高频出现，易被判定套路化',suggestion:'改用你自己的真实起点数字与心情，弱化模板感'}],
    adLaw:[{level:'高',word:'最省事',suggestion:'改为「相对省心」，避免绝对化用语'},{level:'低',word:'绝对',suggestion:'视语境替换为「通常」'}],
    aiSmell:[{issue:'连续三段以「首先/其次/最后」排比',fix:'改为更自然的口语过渡'},{issue:'出现「在这个快节奏的时代」等空泛套话',fix:'删去，用具体场景替代'}],
    aiScore:42,
    summary:'存在 1 处版权套路风险与 2 处广告法极限词，AI 味中等，建议改完再发。'
  });
}

/* ============ Supabase 同步（复用主站机制，URL/anon key 已内置） ============ */
const SYNC_CTRL=['gzh_sync_key','gzh_sync_last','gzh_meta','gzh_ai'];
const isDataKey=full=>typeof full==='string'&&full.startsWith('gzh_')&&!SYNC_CTRL.includes(full);
function getMeta(){ try{ return JSON.parse(localStorage.getItem('gzh_meta')||'{}'); }catch(e){ return {}; } }
function collectAll(){ const out={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
  if(isDataKey(k)){ try{ out[k]=JSON.parse(localStorage.getItem(k)); }catch(e){ out[k]=localStorage.getItem(k); } } } return out; }
function canon(x){
  if(x===null||typeof x!=='object') return JSON.stringify(x);
  if(Array.isArray(x)) return '['+x.map(canon).join(',')+']';
  const ks=Object.keys(x).sort(); return '{'+ks.map(k=>JSON.stringify(k)+':'+canon(x[k])).join(',')+'}';
}
function mergeArr(l,r,lt,rt,tomb){
  let res; const lId=l.length>0&&l.every(x=>x&&typeof x==='object'&&x.id);
  const rId=r.length>0&&r.every(x=>x&&typeof x==='object'&&x.id);
  if(lId&&rId){ const map={}; const order=(rt>=lt)?[...l,...r]:[...r,...l]; order.forEach(x=>{ if(x&&x.id) map[x.id]=x; }); res=Object.values(map); }
  else { const seen=new Set(); res=[]; [...l,...r].forEach(x=>{ const key=(x&&typeof x==='object')?canon(x):String(x); if(!seen.has(key)){ seen.add(key); res.push(x); } }); }
  if(tomb&&Object.keys(tomb).length) res=res.filter(x=>!(x&&x.id&&tomb[x.id]));
  return res;
}
function mergeSync(L,Lm,R,Rm){
  const out={}; const keys=new Set([...Object.keys(L||{}),...Object.keys(R||{})]);
  const dl={}; const Ldl=(L&&L['gzh_del_log'])||{}, Rdl=(R&&R['gzh_del_log'])||{};
  new Set([...Object.keys(Ldl),...Object.keys(Rdl)]).forEach(sk=>{ const m=Object.assign({},Ldl[sk]||{});
    Object.keys(Rdl[sk]||{}).forEach(id=>{ m[id]=Math.max(m[id]||0,Rdl[sk][id]); }); dl[sk]=m; });
  if(Object.keys(dl).length) out['gzh_del_log']=dl;
  const tomb=sk=>{ const s=String(sk||''); return (dl[s]||dl[s.replace(/^gzh_/,'')]||{}); };
  keys.forEach(k=>{ if(!isDataKey(k)||k==='gzh_del_log') return;
    const l=L?L[k]:undefined, r=R?R[k]:undefined;
    if(l===undefined&&r===undefined) return;
    if(Array.isArray(l)&&Array.isArray(r)) out[k]=mergeArr(l,r,(Lm&&Lm[k])||0,(Rm&&Rm[k])||0,tomb(k));
    else if(Array.isArray(l)&&r===undefined) out[k]=l.filter(x=>!(x&&x.id&&tomb(k)[x.id]));
    else if(Array.isArray(r)&&l===undefined) out[k]=r.filter(x=>!(x&&x.id&&tomb(k)[x.id]));
    else { const lt=(Lm&&Lm[k])||0, rt=(Rm&&Rm[k])||0; out[k]=(rt>=lt)?r:l; }
  });
  return out;
}

/* ============ Step 6 专业排版（editorial：深蓝小标题 + 黑正文 + 红强调） ============ */
const WX_H1='<h1 style="color:#1B3A5B;font-size:21px;font-weight:800;text-align:center;margin:0 0 20px;line-height:1.4">';
const WX_H2='<h2 style="color:#1B3A5B;font-size:17px;font-weight:700;margin:22px 0 10px;border-left:4px solid #1B3A5B;padding-left:10px;line-height:1.45">';
const WX_P='<p style="color:#242424;font-size:15px;line-height:1.85;margin:0 0 16px;letter-spacing:.3px">';
function inlineEm(s){ return s.replace(/\*\*(.+?)\*\*/g,'<span style="color:#C62828;font-weight:700">$1</span>'); }
function mdToInlineWx(title,md){
  const lines=md.split('\n'); let html=''; let para=[];
  const flush=()=>{ if(para.length){ html+=WX_P+inlineEm(para.join('<br>'))+'</p>'; para=[]; } };
  for(let raw of lines){ const line=raw.replace(/\r/g,'');
    if(/^##\s+/.test(line)){ flush(); html+=WX_H2+inlineEm(esc(line.replace(/^##\s+/,'')))+'</h2>'; }
    else if(line.trim()===''){ flush(); }
    else { para.push(inlineEm(esc(line.trim()))); } }
  flush();
  const h1=title?WX_H1+inlineEm(esc(title))+'</h1>':'';
  return h1+html;
}

  if(!obj){ box.innerHTML='<div class="card"><div class="st">封面方案</div><div class="empty">AI 未返回可解析结果（DEMO 模式应正常）。可重试。</div></div>'; return; }
  const cs=covers(); const id=uid(); cs.unshift({id,projectId:cur.id,title,result:obj,createdAt:todayStr()}); PS.set('pipe_covers',cs); _lastCoverId=id;
  renderCoverResult(obj,box); renderStepper(); toast('已生成封面方案');
}
function renderCoverResult(r,box){
  const src=(r.sources||[]).map(s=>`<div class="item"><div class="top"><span class="title">${esc(s.name||'')}</span><div class="spacer"></div><a class="navlink" href="${esc(s.url||'#')}" target="_blank" rel="noopener">打开 ↗</a></div><div class="meta">${esc(s.desc||'')}</div></div>`).join('');
  let html=`<div class="card"><div class="st">🎨 封面方案</div>
    <div class="grid2">
      <div><div class="field" style="font-weight:700;color:var(--ink)">主标题（大字）</div><div class="paper">${esc(r.mainTitle||'')}</div></div>
      <div><div class="field" style="font-weight:700;color:var(--ink)">副标题</div><div class="paper">${esc(r.subTitle||'')}</div></div>
    </div>
    <div class="field" style="font-weight:700;color:var(--ink);margin-top:10px">配图提示词（可粘进生图工具 / Canva）</div>
    <div class="paper">${esc(r.prompt||'')}</div>
    <div class="row" style="margin-top:8px"><button class="btn sm" onclick="copyCoverPrompt()">复制提示词</button></div>
    <div class="field" style="font-weight:700;color:var(--ink);margin-top:10px">视觉风格 / 配色</div>
    <div class="meta">${esc(r.style||'')}</div><div class="meta">${esc(r.palette||'')}</div>
  </div>`;
  if(src){ html+=`<div class="card"><div class="st">免费可商用背景素材源</div>${src}<div class="hint">均支持免费可商用（注意个别作者协议），优先选「可商用」筛选。</div></div>`; }
  html+=`<div class="card"><div class="st">去 Canva 做封面</div>
    <div class="hint">点下面按钮在浏览器打开 Canva，用上面的主标题/副标题/提示词套模板做图。也可先在 WorkBuddy 用「金炼之·生图专家」出图，再上传到 Canva 或直接用。</div>
    <div class="row"><button class="btn" onclick="openCanva()">🎨 打开 Canva 做封面</button></div></div>`;
  box.innerHTML=html;
}
function viewCover(id){ const c=covers().find(x=>x.id===id); if(!c) return; _lastCoverId=id; $('#content').innerHTML=''; renderCover(); renderCoverResult(c.result,$('#cvOut')); }
function delCover(id){ if(!confirm('删除该封面方案？')) return; PS.set('pipe_covers',covers().filter(c=>c.id!==id)); markDeleted('gzh_pipe_covers',[id]); toast('已删除'); renderCover(); renderStepper(); }
function openCanva(){ window.open('https://www.canva.com/','_blank','noopener'); }
function copyCoverPrompt(){ const c=covers().find(x=>x.id===_lastCoverId); if(c&&c.result) copyText(c.result.prompt||''); }

/* ============ 通用 ============ */
function fmt(d){ return (d||'').slice(0,10); }
let toastTimer;
function toast(msg){ let t=$('#toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

/* ============ 设置 / 同步 面板 ============ */
function openSet(){ const c=aiCfg();
  $('#setEndpoint').value=c.endpoint||''; $('#setKey').value=c.key||''; $('#setModel').value=c.model||'';
  $('#setMask').classList.add('show'); $('#setModal').classList.add('show'); }
function closeSet(){ $('#setMask').classList.remove('show'); $('#setModal').classList.remove('show'); }
function saveSet(){ PS.set('ai',{endpoint:$('#setEndpoint').value.trim(),key:$('#setKey').value.trim(),model:$('#setModel').value.trim()||'deepseek-chat'});
  refreshAiStatus(); $('#setMsg').textContent='已保存 ✓（主站同步生效）'; toast('AI 设置已保存'); }
function applyPreset(p){
  if(p==='deepseek'){ $('#setEndpoint').value='https://api.deepseek.com/chat/completions'; $('#setModel').value='deepseek-chat'; }
  if(p==='qwen'){ $('#setEndpoint').value='https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions'; $('#setModel').value='qwen-plus'; }
  if(p==='openai'){ $('#setEndpoint').value='https://api.openai.com/v1/chat/completions'; $('#setModel').value='gpt-4o-mini'; }
}
function toggleSyncBar(){ const bar=$('#syncbar'); const show=bar.style.display==='none'; bar.style.display=show?'block':'none';
  if(show){ $('#syncKey').value=PS.get('sync_key','')||''; } }

/* ============ 启动 ============ */
function init(){
  $('#syncKey') && ($('#syncKey').value=PS.get('sync_key','')||'');
  $('#setBtn').onclick=openSet; $('#setClose').onclick=closeSet; $('#setMask').onclick=closeSet;
  $('#setSave').onclick=saveSet; $$('.preset').forEach(b=>b.onclick=()=>applyPreset(b.dataset.p));
  $('#syncBtn').onclick=toggleSyncBar; $('#syncUp').onclick=syncUpload; $('#syncDown').onclick=syncDownload;
  $('#syncKey').addEventListener('blur',()=>PS.set('sync_key',$('#syncKey').value.trim()));
  $('#syncExp').onclick=()=>{ const blob=new Blob([JSON.stringify({updatedAt:Date.now(),data:collectAll()},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='gzh-pipe-backup-'+todayStr()+'.json'; a.click(); };
  $('#syncImp').onclick=()=>$('#syncFile').click();
  $('#syncFile').onchange=async e=>{ const f=e.target.files[0]; if(!f) return;
    try{ const j=JSON.parse(await f.text()); if(!j.data) throw new Error('格式不对');
      const merged=mergeSync(collectAll(),getMeta(),j.data,{}); persistMerged(merged,getMeta());
      toast('已合并导入'); renderCurrent(); }catch(err){ toast('导入失败：'+err.message); } e.target.value=''; };
  refreshAiStatus();
  const h=location.hash?location.hash.slice(1):''; curStep=STEPS.find(s=>s.id===h)?h:(PS.get('pipe_step','genre')||'genre');
  renderStepper(); STEPS.find(s=>s.id===curStep).render();
}
window.gotoStep=gotoStep; window.pickProject=pickProject; window.delProject=delProject;
window.setTopicFilter=setTopicFilter; window.adoptTopic=adoptTopic; window.dropTopic=dropTopic;
window.editTopic=editTopic; window.cancelTopicEdit=cancelTopicEdit; window.saveTopicEdit=saveTopicEdit; window.delTopic=delTopic;
window.viewDraft=viewDraft; window.delDraft=delDraft; window.copyDraft=copyDraft;
window.viewCheck=viewCheck; window.delCheck=delCheck; window.copyCheckReport=copyCheckReport; window.copyText=copyText;
window.viewLayout=viewLayout; window.delLayout=delLayout; window.copyLayoutHtml=copyLayoutHtml; window.copyLayoutText=copyLayoutText;
window.viewCover=viewCover; window.delCover=delCover; window.openCanva=openCanva; window.copyCoverPrompt=copyCoverPrompt;
init();
</script>
