<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F3">
<title>日迹 · 备忘录工作台</title>
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>

<div class="shell">

  <nav class="rail">
    <div class="rail-brand">日</div>
    <button class="rail-btn is-on" data-act="nav" data-view="calendar" aria-label="日历">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>日历</span>
    </button>
    <button class="rail-btn" data-act="nav" data-view="stream" aria-label="流水">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h8l4 4v14H6z"/><path d="M9 12h6M9 16h4"/></svg>
      <span>流水</span>
    </button>
    <button class="rail-btn" data-act="nav" data-view="stats" aria-label="统计">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 20V11M11 20V4M17 20v-6"/><path d="M3 20h18"/></svg>
      <span>统计</span>
    </button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" data-act="nav" data-view="settings" aria-label="设置">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="tb-left">
        <h1 id="viewTitle">日历</h1>
        <span class="sync-dot off" id="syncDot"></span>
      </div>
      <div class="tb-right" id="topActions"></div>
    </header>

    <section class="view is-on" id="view-calendar">
      <div class="cal-pane">
        <div class="cal-toolbar" id="calToolbar"></div>
        <div class="weekdays">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span>
          <span class="wk">六</span><span class="wk">日</span>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-legend" id="calLegend"></div>
      </div>
      <aside class="day-pane" id="dayPane"></aside>
    </section>

    <section class="view" id="view-stream">
      <div class="stream-toolbar" id="streamToolbar"></div>
      <div class="stream-list" id="streamList"></div>
    </section>

    <section class="view" id="view-stats">
      <div class="stats-body" id="statsBody"></div>
    </section>

    <section class="view" id="view-settings">
      <div class="settings-body" id="settingsBody"></div>
    </section>
  </div>

</div>

<div class="mask" id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  if (!window.supabase) {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');
  }
</script>
<script src="js/config.js?v=1"></script>
<script src="js/store.js?v=1"></script>
<script src="js/sync.js?v=1"></script>
<script src="js/app.js?v=1"></script>

</body>
</html>
