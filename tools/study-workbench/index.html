<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>学习工作台 · SQL / EXCEL / Python / JAVA</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e8ef; --primary:#4f46e5; --primary-soft:#eef2ff;
    --danger:#dc2626; --ok:#16a34a; --warn:#d97706;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
  }
  .app{display:flex;min-height:100vh}
  .sidebar{
    width:240px; flex:0 0 240px; background:var(--card); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:14px 10px; gap:4px;
    transition:width .22s ease, transform .22s ease; position:relative; z-index:30;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:8px 10px 14px;font-weight:700;font-size:16px;color:var(--primary)}
  .brand .logo{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;background:var(--primary-soft);border-radius:9px;color:var(--primary)}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;
    color:var(--ink);font-weight:500;font-size:14.5px;min-height:44px;user-select:none;transition:background .15s;
  }
  .nav-item .ico{width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;color:var(--muted)}
  .nav-item:hover{background:#f3f4f8}
  .nav-item.active{background:var(--primary-soft);color:var(--primary)}
  .nav-item.active .ico{color:var(--primary)}
  .nav-sep{height:1px;background:var(--line);margin:10px 8px}
  .app.collapsed .sidebar{width:64px;flex-basis:64px}
  .app.collapsed .brand span, .app.collapsed .nav-item span{display:none}
  .app.collapsed .nav-item{justify-content:center;padding:11px 0}
  .app.collapsed .brand{justify-content:center;padding:8px 0 14px}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--card);
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap;
  }
  .icon-btn{
    width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;
    display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:0 0 44px;
  }
  .icon-btn:hover{background:#f3f4f8;color:var(--ink)}
  .topbar h1{font-size:17px;margin:0;flex:1;min-width:120px}
  .topbar .actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 14px;border-radius:10px;
    border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;cursor:pointer;font-weight:500;
    white-space:nowrap;text-decoration:none;
  }
  .btn:hover{background:#f3f4f8}
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost-danger{color:var(--danger);border-color:#f3c9c9}
  .btn.ghost-danger:hover{background:#fef2f2}
  .content{padding:18px;max-width:1100px;width:100%;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
  .today{
    background:linear-gradient(180deg,#fff,#fcfdff);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .today h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .today .count{background:var(--primary);color:#fff;font-size:12px;border-radius:20px;padding:1px 9px;font-weight:600}
  .today-empty{color:var(--muted);font-size:14px;padding:6px 2px}
  .t-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:#fff;
    border:1px solid var(--line);margin-bottom:8px;
  }
  .t-item.overdue{border-color:#f3c9c9;background:#fff7f7}
  .t-item .meta{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
  .t-item .t-title{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .t-item .t-sub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tag{font-size:11px;padding:1px 7px;border-radius:6px;background:#eef2ff;color:var(--primary);font-weight:600}
  .tag.ex{background:#f0fdf4;color:var(--ok)}
  .date-badge{font-size:11.5px;padding:1px 7px;border-radius:6px;background:#f3f4f8;color:var(--muted)}
  .date-badge.over{background:#fee2e2;color:var(--danger);font-weight:600}
  .date-badge.today{background:#eef2ff;color:var(--primary);font-weight:600}
  .do-btn{height:36px;padding:0 12px;border-radius:8px;background:var(--primary);color:#fff;border:none;font-size:13px;cursor:pointer;font-weight:600;flex:0 0 auto}
  .do-btn:hover{filter:brightness(1.06)}
  .page-head{display:flex;align-items:center;gap:12px;margin:4px 0 16px}
  .page-head .ph-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff}
  .page-head h2{margin:0;font-size:20px}
  .page-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .subboard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px;box-shadow:var(--shadow)}
  .subboard-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .subboard-head .s-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .subboard-head .s-prog{font-size:13px;color:var(--muted);margin-left:auto}
  .search{flex:1 1 150px;min-width:120px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
  .search:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .pager{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px}
  .pg{min-width:40px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:14.5px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
  .pg:hover{border-color:var(--primary);color:var(--primary)}
  .pg.cur{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
  .pg[disabled]{opacity:.4;cursor:default;color:var(--muted);background:#fff;border-color:var(--line)}
  .pg-dots{padding:0 7px;color:var(--muted);font-size:14px;align-self:center;white-space:nowrap}
  @media(max-width:600px){ .pg{min-width:36px;padding:0 9px;font-size:13.5px;height:38px} .pager{gap:4px} }
  .bar{height:7px;background:#eef0f5;border-radius:6px;overflow:hidden;flex:1;min-width:80px;max-width:160px}
  .bar > i{display:block;height:100%;background:var(--primary);border-radius:6px;transition:width .3s}
  .add-form{display:none;background:#f8f9fc;border:1px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:12px;gap:8px;flex-wrap:wrap}
  .add-form.show{display:flex}
  .add-form input,.add-form textarea{
    font-size:16px;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-family:inherit;color:var(--ink);
  }
  .add-form input[type=text],.add-form textarea{flex:1;min-width:160px}
  .add-form .grow{flex:1 1 100%}
  .add-form textarea{resize:vertical;min-height:54px}
  .add-form label{font-size:13px;color:var(--muted);flex:1 1 100%;margin-top:2px}
  .l-item{
    display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border-radius:10px;background:#fff;
    border:1px solid var(--line);margin-bottom:9px;
  }
  .l-item.done{background:#f6fdf8;border-color:#d6f0dd}
  .chk{
    width:24px;height:24px;flex:0 0 24px;border-radius:7px;border:2px solid #cbd2e0;background:#fff;cursor:pointer;
    display:grid;place-items:center;margin-top:2px;transition:.15s;
  }
  .chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .l-body{flex:1;min-width:0}
  .l-title{font-weight:600;font-size:14.5px}
  .l-item.done .l-title{text-decoration:line-through;color:var(--muted)}
  .l-desc{font-size:13px;color:var(--muted);margin-top:2px}
  .l-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .act{background:none;border:none;cursor:pointer;font-size:13px;padding:4px 9px;border-radius:7px;font-weight:600;color:var(--primary)}
  .act:hover{background:var(--primary-soft)}
  .del{color:var(--muted);background:none;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:7px}
  .del:hover{color:var(--danger);background:#fef2f2}
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .ov-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
  .ov-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.08)}
  .ov-card .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .ov-card .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff}
  .ov-card .nm{font-weight:700;font-size:15px}
  .ov-card .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0}
  .ov-card .row b{color:var(--ink)}
  .plan-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .plan-box .pb-txt{flex:1;min-width:200px}
  .plan-box .pb-txt b{font-size:15px}
  .plan-box .pb-txt p{margin:4px 0 0;color:var(--muted);font-size:13px}
  .field-inline{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
  .field-inline input{width:64px;height:40px;font-size:16px;text-align:center;border:1px solid var(--line);border-radius:9px}
  .hint{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
  .modal{display:none;position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;padding:16px;overflow:auto}
  .modal.show{display:flex;align-items:flex-start;justify-content:center;padding-top:5vh}
  .modal-card{background:#fff;border-radius:16px;max-width:780px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.28);max-height:90vh;display:flex;flex-direction:column}
  .modal-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0}
  .modal-head h3{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modal-head .x{width:38px;height:38px;flex:0 0 38px;border:none;background:#f3f4f8;border-radius:10px;cursor:pointer;font-size:20px;color:var(--muted);line-height:1}
  .modal-head .x:hover{background:#e9ebf0}
  .modal-body{padding:18px;overflow:auto}
  .md p{margin:0 0 8px}
  .md b{color:var(--ink)}
  pre.code{background:#0f172a;color:#e2e8f0;padding:12px 14px;border-radius:10px;overflow:auto;font-size:13px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;margin:6px 0 12px}
  .muted{color:var(--muted)}
  .editor{width:100%;min-height:240px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:16px;line-height:1.55;padding:12px;border:1px solid var(--line);border-radius:10px;background:#0f172a;color:#e2e8f0;resize:vertical}
  .editor::placeholder{color:#64748b}
  .editor.light{background:#fff;color:var(--ink)}
  .sec-label{font-weight:600;font-size:14px;margin:4px 0 8px;display:flex;align-items:center;gap:6px}
  .scrim{display:none}
  @media(max-width:768px){
    .sidebar{position:fixed;top:0;left:0;height:100%;transform:translateX(-100%);box-shadow:0 0 30px rgba(0,0,0,.15)}
    .app.nav-open .sidebar{transform:none}
    .app.collapsed .sidebar{width:240px;flex-basis:240px}
    .app.collapsed .brand span,.app.collapsed .nav-item span{display:inline}
    .app.collapsed .nav-item,.app.collapsed .brand{justify-content:flex-start;padding:11px 12px}
    .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
    .content{padding:14px}
    .topbar{padding:10px 12px}
    .topbar h1{font-size:15px}
    .modal{padding:0}
    .modal.show{padding-top:0;align-items:stretch}
    .modal-card{max-width:none;max-height:100vh;height:100%;border-radius:0}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo" id="brandLogo"></span>
      <span>学习工作台</span>
    </div>
    <div class="nav-item" data-page="overview">
      <span class="ico" id="icOverview"></span><span>概览</span>
    </div>
    <div class="nav-sep"></div>
    <div id="trackNav"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" title="折叠/展开导航"></button>
      <h1 id="pageTitle">学习工作台</h1>
      <div class="actions">
        <button class="btn" id="exportBtn"></button>
        <button class="btn" id="importBtn"></button>
        <input type="file" id="importFile" accept="application/json" hidden>
        <button class="btn ghost-danger" id="clearSampleBtn"></button>
      </div>
    </div>

    <div class="content">
      <section class="today" id="todayBox"></section>
      <div id="pageContent"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="mTitle"></h3>
      <button class="x" id="mClose" title="关闭">×</button>
    </div>
    <div class="modal-body" id="mBody"></div>
  </div>
</div>

<script>
/* ============ 图标 ============ */
const I = {
  book:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  grid:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  db:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>',
  table:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>',
  code:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>',
  coffee:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><path d="M6 1v3M10 1v3M14 1v3"/></svg>',
  check:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  download:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>',
  upload:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/></svg>',
  trash:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  menu:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>',
  pen:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  run:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z" fill="currentColor"/></svg>',
  warn:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
  spark:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>',
  lib:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  link:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
};

/* ============ 配置 ============ */
const LS_KEY = 'wb_learn_data_v1';
const TRACKS = {
  sql:   {name:'SQL',    icon:I.db,    color:'#2563eb'},
  excel: {name:'EXCEL',  icon:I.table, color:'#16a34a'},
  python:{name:'Python', icon:I.code,  color:'#ea580c'},
  java:  {name:'JAVA',   icon:I.coffee,color:'#dc2626'}
};
const RUNNER = {
  sql:   {url:'https://sqliteonline.com/',                      note:'网页直接写 SQL 运行（建表/查询）'},
  python:{url:'https://www.programiz.com/python-programming/online-compiler/', note:'在线 Python 编译器，可运行对照'},
  java:  {url:'https://www.onlinegdb.com/online_java_compiler', note:'在线 Java 编译器'},
  excel: {url:'https://docs.qq.com/',                          note:'Excel 请在 Excel/WPS/腾讯文档表格中练习'}
};
const FENCE = '§§§';

/* ============ 状态 ============ */

let currentPage = 'overview';

/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const todayStr = () => fmt(new Date());
function fmt(d){ const x=new Date(d); const p=n=>String(n).padStart(2,'0'); return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate()); }
function uid(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderMD(src){
  if(!src || !String(src).trim()) return '<p class="muted">（暂无内容，点“编辑/补充”添加）</p>';
  const parts = String(src).split(FENCE);
  let html='';
  parts.forEach((part,i)=>{
    if(i%2===1){ html += '<pre class="code">'+esc(part.replace(/^\n/,'').replace(/\n$/,''))+'</pre>'; }
    else { part.split('\n').forEach(ln=>{ if(ln.trim()==='') return; html += '<p>'+esc(ln).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</p>'; }); }
  });
  return html;
}

/* ============ 存取 + 迁移 ============ */
function load(){
  let raw=null; try{ raw=localStorage.getItem(LS_KEY); }catch(e){}
  if(raw){
    try{ const d=JSON.parse(raw); state.items=Array.isArray(d.items)?d.items:[]; state.settings=d.settings||{perDay:3}; }
    catch(e){ state.items=[]; }
  } else { state.items=[]; }
  if(state.items.length===0){ state.items = seed(); state.settings={perDay:3}; }
  if(migrate()) save();
}
function migrate(){
  const fresh = seed();
  const dm={}, pm={}, pm2={};
  fresh.forEach(s=>{ if(s.type==='knowledge') dm[s.title]=s.detail; if(s.type==='exercise'){ pm[s.title]=s.problem; pm2[s.title]={platform:s.platform||'',url:s.url||''}; } });
  let changed=false;
  state.items.forEach(it=>{
    if(it.type==='knowledge' && it.seed && (!it.detail || !it.detail.trim())){ it.detail=dm[it.title]||''; if(it.detail) changed=true; }
    if(it.type==='exercise' && it.seed && (!it.problem || !it.problem.trim())){ it.problem=pm[it.title]||''; if(it.problem) changed=true; }
    if(it.type==='exercise' && it.code==null){ it.code=''; changed=true; }
    if(it.type==='exercise'){
      const e=pm2[it.title];
      if(e){
        if(!it.platform){ it.platform=e.platform; changed=true; }
        if(!it.url){ it.url=e.url; changed=true; }
      }
    }
  });
  return changed;
}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){ alert('保存失败：本地存储不可用或已满'); } }

/* ============ 排程工具 ============ */
function scheduleItems(arr, perDay, startD){
  const d=new Date(startD); d.setHours(0,0,0,0); let count=0;
  arr.forEach(it=>{ it.planDate=fmt(d); count++; if(count>=perDay){ count=0; d.setDate(d.getDate()+1); } });
}
function lastPlanDate(){
  let maxD=null;
  state.items.forEach(i=>{ if(i.planDate && (!maxD||i.planDate>maxD)) maxD=i.planDate; });
  return maxD;
}
// 起点：今天；若已有未来排程，则从“最后一天之后”开始，避免覆盖已有安排
function planStart(){
  let s=new Date(); s.setHours(0,0,0,0);
  const md=lastPlanDate();
  if(md){ const x=new Date(md); x.setDate(x.getDate()+1); if(x>s) s=x; }
  return s;
}

/* ============ 派生 ============ */
function isOverdue(it){ return !it.done && it.planDate && it.planDate < todayStr(); }
function isToday(it){ return !it.done && it.planDate && it.planDate === todayStr(); }
function todayList(){
  const t = todayStr();
  return state.items.filter(it=>!it.done && it.planDate && it.planDate <= t)
    .sort((a,b)=> a.planDate<b.planDate?-1:1);
}
function trackStats(track){
  const arr = state.items.filter(i=>i.track===track);
  const k = arr.filter(i=>i.type==='knowledge');
  const e = arr.filter(i=>i.type==='exercise');
  return { total:arr.length, kDone:k.filter(i=>i.done).length, kTotal:k.length, eDone:e.filter(i=>i.done).length, eTotal:e.length };
}

/* ============ 圆环 ============ */
function ring(percent,color){
  const r=26,c=2*Math.PI*r,off=c*(1-percent);
  return `<svg width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="#eef0f5" stroke-width="6"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">${Math.round(percent*100)}%</text>
  </svg>`;
}

  ['knowledge','exercise'].forEach(type=>{
    const label = type==='knowledge'?'知识点':'练习';
    const taLabel = type==='knowledge'?'知识点详情（讲解、示例，可用 §§§ 包裹代码块）':'题目描述（要求、示例输入/输出）';

    const tagColor = type==='exercise'?'background:#f0fdf4;color:var(--ok)':'background:#eef2ff;color:var(--primary)';
    html += `<div class="subboard">
      <div class="subboard-head">
        <div class="s-title"><span class="tag ${typeCls}" style="${tagColor}">${label}</span></div>
        <input type="text" class="search" id="search-${key}-${type}" placeholder="搜索${label}（标题/说明）" value="${esc(FILTER[key+'_'+type]||'')}">
        <button class="btn" data-add="${key}:${type}" style="margin-left:auto">${I.plus} 添加${label}</button>
        <div class="s-prog" id="cnt-${key}-${type}"></div>
      </div>
      <div class="add-form" id="form-${key}-${type}">
        <input type="text" class="grow" id="ti-${key}-${type}" placeholder="标题，如：窗口函数 ROW_NUMBER">
        <textarea class="grow" id="de-${key}-${type}" placeholder="一句话说明（可选）"></textarea>
        <label>${taLabel}</label>
        <textarea class="grow" id="dt-${key}-${type}" placeholder="在这里填写内容…"></textarea>
        <input type="date" id="pd-${key}-${type}" value="${todayStr()}">
        <button class="btn primary" data-save="${key}:${type}">保存</button>
        <button class="btn" data-cancel="${key}:${type}">取消</button>
      </div>
      <div id="list-${key}-${type}"></div>

  document.querySelectorAll('[data-add]').forEach(b=> b.onclick=()=>{
    const f=$('#form-'+b.dataset.add.replace(':','-')); f.classList.toggle('show');
    $('#ti-'+b.dataset.add.replace(':','-')).focus();
  });
  document.querySelectorAll('[data-cancel]').forEach(b=> $('#form-'+b.dataset.cancel.replace(':','-')).classList.remove('show'));
  document.querySelectorAll('[data-save]').forEach(b=>{

function renderList(key,type){
  const all=state.items.filter(i=>i.track===key && i.type===type);
  const kw=(FILTER[key+'_'+type]||'').toLowerCase();
  const arr = kw ? all.filter(i=> (i.title||'').toLowerCase().includes(kw) || (i.desc||'').toLowerCase().includes(kw)) : all;
  const doneAll=all.filter(i=>i.done).length;
  const pct= all.length? doneAll/all.length : 0;
  const cap=$('#cnt-'+key+'-'+type);
  if(cap){ cap.innerHTML = doneAll+'/'+all.length+' <span class="bar" style="display:inline-flex;vertical-align:middle;margin-left:6px"><i style="width:'+(pct*100).toFixed(0)+'%"></i></span>'; }

  const total = Math.max(1, Math.ceil(arr.length / PAGE_SIZE));
  let pg = PAGE[key+'_'+type] || 1;
  if(pg<1) pg=1; if(pg>total) pg=total;
  PAGE[key+'_'+type]=pg;
  const vis = arr.slice((pg-1)*PAGE_SIZE, pg*PAGE_SIZE);

  let h;
  if(arr.length===0){
    h = `<div class="today-empty" style="padding:10px 2px">${kw?'没有匹配「'+esc(kw)+'」的内容。':'还没有'+(type==='knowledge'?'知识点':'练习')+'，点「添加」开始吧。'}</div>`;
  } else {
    h = renderItems(vis, key, type);
    h += buildPager(pg, total, arr.length);
  }
  const box=$('#list-'+key+'-'+type);
  if(box) box.innerHTML=h;
  bindPager(box, key, type);
}

function buildPager(pg,total,totalCount){
  if(total<=1) return '';
  const set=new Set([1, total, pg, pg-1, pg+1, pg-2, pg+2]);
  const nums=[];
  [...set].filter(n=>n>=1 && n<=total).sort((a,b)=>a-b).forEach(n=>{
    if(nums.length && n-nums[nums.length-1]>1) nums.push('…');
    nums.push(n);
  });
  const cur = pg<=1 ? `<button class="pg cur" disabled>‹ 上一页</button>`
                    : `<button class="pg" data-pg="${pg-1}">‹ 上一页</button>`;
  const mid = nums.map(n=> n==='…' ? `<span class="pg-dots">…</span>`
                              : `<button class="pg ${n===pg?'cur':''}" data-pg="${n}">${n}</button>`).join('');
  const nx  = pg>=total ? `<button class="pg cur" disabled>下一页 ›</button>`
                        : `<button class="pg" data-pg="${pg+1}">下一页 ›</button>`;
  return `<div class="pager">${cur}${mid}${nx}<span class="pg-dots" style="margin-left:4px">第 ${pg}/${total} 页 · 共 ${totalCount} 条</span></div>`;
}

function bindPager(box,key,type){
  if(!box) return;
  box.querySelectorAll('[data-pg]').forEach(b=>{
    b.onclick=()=>{
      const n=parseInt(b.dataset.pg,10); if(isNaN(n)) return;
      PAGE[key+'_'+type]=n; renderList(key,type);
      const sb=box.closest('.subboard'); if(sb) sb.scrollIntoView({behavior:'smooth',block:'start'});
    };
  });
}
function renderItems(arr,key,type){
  if(arr.length===0) return `<div class="today-empty" style="padding:6px 2px">还没有${type==='knowledge'?'知识点':'练习'}，点「添加」开始吧。</div>`;
  const sorted=[...arr].sort((a,b)=>{ if(a.done!==b.done) return a.done?1:-1; return (a.planDate||'')<(b.planDate||'')?-1:1; });
  let h='';
  sorted.forEach(it=>{
    const od=isOverdue(it);
    const dcls = od?'over':(isToday(it)?'today':'');
    const dlabel = od?'逾期':(isToday(it)?'今天':(it.planDate||''));
    const learnBtn = type==='knowledge'
      ? `<button class="act" data-learn="${it.id}">${I.pen} 学习</button>`
      : `<button class="act" data-doex="${it.id}">${I.run} 做题</button>`;
    h += `<div class="l-item ${it.done?'done':''}">
      <div class="chk ${it.done?'on':''}" data-chk="${it.id}">${it.done?I.check:''}</div>
      <div class="l-body">
        <div class="l-title">${esc(it.title)}</div>
        ${it.desc?`<div class="l-desc">${esc(it.desc)}</div>`:''}
        <div class="l-foot">
          ${it.planDate?`<span class="date-badge ${dcls}">${dlabel} ${it.planDate}</span>`:`<span class="date-badge">未排程</span>`}
          ${it.seed?'<span class="date-badge">示例</span>':''}
          ${it.type==='exercise'&&it.platform?'<span class="date-badge" style="background:#fff7ed;color:#c2410c;border-color:#fed7aa">'+esc(it.platform)+'</span>':''}
          ${learnBtn}
          <button class="del" data-del="${it.id}">${I.trash} 删除</button>
        </div>
      </div>
    </div>`;
  });
  return h;
}

      code: "💻 代码示例：\nimport re\n\n# 基础\nre.findall(r'\\d+', 'a12b34')           # ['12', '34']\nre.search(r'\\d+', 'a12b34').group()    # '12'\nre.match(r'\\d+', '12ab')               # 开头匹配\nre.sub(r'\\s+', ' ', 'a  b\\n c')        # 'a b c'\nre.split(r'[,;]', 'a,b;c')              # ['a', 'b', 'c']\n\n# 邮箱提取\nre.findall(r'[\\w.]+@[\\w.]+\\.\\w+', text)\n\n# 命名分组\nm = re.search(r'(?P<year>\\d{4})-(?P<month>\\d{2})', '2026-08')\nprint(m.group('year'), m.group('month'))  # 2026 08\n\n# 预编译（多次匹配更快）\nphone_re = re.compile(r'1[3-9]\\d{9}')\nfor line in text.split('\\n'):\n    if m := phone_re.search(line):\n        print(m.group())\n\n# 贪婪 vs 非贪婪\nre.findall(r'<.+>', '<a><b>')           # ['<a><b>']  贪婪\nre.findall(r'<.+?>', '<a><b>')          # ['<a>', '<b>'] 非贪婪",
      pitfall: "⚠️ 常见坑 & 练习建议：\n• 反斜杠陷阱：写 `r'\\d+'`（原始字符串），别写 `'\\\\d+'`。\n• 贪婪默认——提取 HTML/XML 标签时几乎都要非贪婪 `+?`。\n• `^/$` 默认匹配**单行**字符串首尾；多行用 `re.M` flag。\n• `re.sub` 的替换串里 `\\1` 是反向引用、`\\g<name>` 是命名——别和正则本身的 `\\1` 搞混。\n• 练习：提取一段文本里的所有 URL/邮箱/手机号/身份证号。"

function enhanceDetail(track, title, currentDetail){
  const cur = (currentDetail||'').trim();
  if(cur.length >= 200) return '';   // 内容够长，不增强
  const lib = ENHANCE_CONTENT[track]; if(!lib) return '';
  const t = (title||'').toLowerCase();
  let hit = null;
  for(const k in lib){
    const cat = lib[k];
    if((cat.kw||[]).some(w => t.indexOf(String(w).toLowerCase()) >= 0)){ hit = cat; break; }
  }
  if(!hit){
    // 兜底：通用学习框架（适用于任何知识点）
    return '## 📖 学习通用框架\n' +
      '本知识点的内容你看到的可能比较简略。推荐按以下四步深入学习：\n' +
      '1) **是什么**：用一句话讲清概念；2) **为什么用**：解决什么问题、替代什么方案；\n' +
      '3) **怎么用**：最小可运行示例（搜「' + title + ' example」即可）；\n' +
      '4) **什么时候别用**：反模式、坑、性能成本。\n\n' +
      '## 🔍 深入学习路径\n' +
      '• 官方文档/教程：搜「' + (track==='sql'?'SQL':track==='excel'?'Excel':track==='python'?'Python':'Java') + ' ' + title + ' 官方文档」\n' +
      '• 经典题：在「去原站练习」按钮跳到牛客/和鲸/天池/力扣搜题号或关键词\n' +
      '• 进阶：能给别人讲清楚 5 分钟才算真会——试着写一段「教程」给同事看\n\n' +
      '## 💻 推荐做法\n' +
      '把本知识点拆成「3 段代码示例」亲自跑一遍：\n' +
      '```\n' +
      '// 示例 1：最小可用（Hello World 级别）\n' +
      '// 示例 2：常见场景（真实业务片段）\n' +
      '// 示例 3：边界/异常（出错时怎么处理）\n' +
      '```\n\n' +
      '## ⚠️ 学习建议\n' +
      '• **别死记硬背**——每个知识点配套 3 道题，做完才算会。\n' +
      '• **建错题本**：在练习题里把「卡壳过」的题标记，多次重做。\n' +
      '• **教别人**：写一段 100 字的「如果我给别人讲' + title + '」——讲不出来说明没真懂。';
  }
  // 拼接 4 段为 markdown 风格字符串，由 renderMD 渲染
  return '## 📖 概念原理\n' + hit.concept + '\n\n' +
         '## 🔍 深入机制\n' + hit.deep + '\n\n' +
         '## ' + hit.code + '\n\n' +
         '## ' + hit.pitfall;
}

/* ============ 弹窗：知识点 ============ */
function openKnowledge(id){
  const it=state.items.find(i=>i.id===id); if(!it) return;
  const body = `
    <div class="md" id="kView">${renderMD( (it.detail||'') + enhanceDetail(it.track, it.title, it.detail) )}</div>
    <textarea class="editor light" id="kEdit" style="display:none">${esc(it.detail||'')}</textarea>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button class="btn" id="kEditBtn">${I.pen} 编辑详情</button>
      <button class="btn primary" id="kSaveBtn" style="display:none">保存详情</button>
      <button class="btn" id="kCloseBtn">关闭</button>
    </div>`;
  openModal(it.title, body, ()=>{
    $('#kEditBtn').onclick=()=>{ $('#kView').style.display='none'; $('#kEdit').style.display='block'; $('#kEditBtn').style.display='none'; $('#kSaveBtn').style.display='inline-flex'; $('#kEdit').focus(); };
    $('#kSaveBtn').onclick=()=>{ it.detail=$('#kEdit').value; save(); closeModal(); render(); };
    $('#kCloseBtn').onclick=closeModal;
  });
}
/* ============ 弹窗：练习 ============ */
function openExercise(id){
  const it=state.items.find(i=>i.id===id); if(!it) return;
  const t=TRACKS[it.track]; const r=RUNNER[it.track];
  const body = `
    <div class="sec-label">${I.run} 题目</div>
    <div class="md" id="eProb">${renderMD(it.problem)}</div>
    <div class="sec-label" style="margin-top:14px">${I.code} 我的作答 <span class="muted" style="font-weight:400;font-size:12.5px">（自动保存）</span></div>
    <textarea class="editor" id="eCode" placeholder="在这里编写你的代码 / 解答，失焦自动保存…">${esc(it.code||'')}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center">
      <button class="btn primary" id="eSave">${I.check} 保存作答</button>
      <a class="btn" id="eRun" href="${r.url}" target="_blank" rel="noopener">${I.run} 打开${t.name}运行环境</a>
      ${ it.url ? '<a class="btn" id="eSrc" href="'+esc(it.url)+'" target="_blank" rel="noopener" style="background:#fff7ed;color:#c2410c;border-color:#fed7aa">'+I.link+' 去原站练习'+(it.platform?('（'+esc(it.platform)+'）'):'')+'</a>' : '' }
      <span class="muted" style="font-size:12.5px">${r.note}</span>
      <button class="btn" id="eClose" style="margin-left:auto">关闭</button>
    </div>`;
  openModal(it.title, body, ()=>{
    const ta=$('#eCode');
    ta.addEventListener('input',()=>{ it.code=ta.value; });
    ta.addEventListener('blur',()=>{ it.code=ta.value; save(); });
    $('#eSave').onclick=()=>{ it.code=ta.value; save(); alert('已保存'); };
    $('#eClose').onclick=closeModal;
  });
}
function openModal(title, bodyHTML, after){
  $('#mTitle').textContent=title; $('#mBody').innerHTML=bodyHTML; $('#modal').classList.add('show');
  if(after) after();
}
function closeModal(){ $('#modal').classList.remove('show'); }

/* ============ 操作 ============ */
function markDone(id){ const it=state.items.find(i=>i.id===id); if(!it) return; it.done=true; it.doneDate=todayStr(); save(); render(); }
function toggle(id){ const it=state.items.find(i=>i.id===id); if(!it) return; it.done=!it.done; if(it.done) it.doneDate=todayStr(); else delete it.doneDate; save(); render(); }
function del(id){ if(!confirm('确定删除这条？')) return; state.items=state.items.filter(i=>i.id!==id); save(); render(); }
function generatePlan(){
  const perDay=state.settings.perDay||3;
  const unsched=state.items.filter(i=>!i.done && !i.planDate);   // 已学过的 done 排除；已排程(有 planDate)排除
  if(unsched.length===0){ alert('当前没有待排程的内容（已学过/已排程的不会重复排）。'); render(); return; }
  scheduleItems(unsched, perDay, planStart());
  save(); render();
  alert('已安排 '+unsched.length+' 条未排程内容（已学过的不会重复排）。');
}
function extendLib(){
  const have=new Set(state.items.map(i=>i.title));
  const fresh=seed();
  const toAdd=fresh.filter(x=>!have.has(x.title));
  if(toAdd.length===0){ alert('完整知识库/习题库已包含，无需补齐。'); return; }
  scheduleItems(toAdd, state.settings.perDay||3, planStart());
  toAdd.forEach(x=> state.items.push(x));
  save(); render();
  alert('已补齐 '+toAdd.length+' 条（知识库/习题库已完整，原数据保留）。');
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='学习工作台备份_'+todayStr()+'.json'; a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.items||!Array.isArray(d.items)) throw 0;
      if(!confirm('导入将覆盖当前所有数据，确定继续？')) return;
      state.items=d.items; state.settings=d.settings||{perDay:3};
      state.items.forEach(i=>{ i.done=!!i.done; i.seed=!!i.seed; if(!i.id) i.id=uid(); if(i.type==='exercise'&&i.code==null)i.code=''; });
      save(); render(); alert('导入成功，共 '+state.items.length+' 条。');
    }catch(e){ alert('文件格式不正确，导入失败。'); }
  };
  r.readAsText(file);
}
function clearSample(){
  if(!confirm('清空所有示例数据（保留你自己添加的）？')) return;
  state.items=state.items.filter(i=>!i.seed); save(); render(); alert('示例数据已清空。');
}
function toggleNav(){ if(window.innerWidth<=768){ $('#app').classList.toggle('nav-open'); } else { $('#app').classList.toggle('collapsed'); } }
function closeNav(){ $('#app').classList.remove('nav-open'); }

/* ============ 主渲染 ============ */
function render(){
  renderSidebar();
  if(currentPage==='overview'){ $('#pageTitle').textContent='学习工作台 · 概览'; renderOverview(); }
  else { $('#pageTitle').textContent=TRACKS[currentPage].name+' 学习'; renderTrackPage(currentPage); }
  renderToday();
  $('#exportBtn').innerHTML=I.download+' 导出 JSON';
  $('#importBtn').innerHTML=I.upload+' 导入恢复';
  $('#clearSampleBtn').innerHTML=I.trash+' 清空示例';
}

/* ============ 事件 ============ */
$('#menuBtn').onclick=toggleNav;
$('#scrim').onclick=closeNav;
$('#exportBtn').onclick=exportJSON;
$('#importBtn').onclick=()=> $('#importFile').click();
$('#importFile').onchange=e=>{ if(e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; };
$('#clearSampleBtn').onclick=clearSample;
$('#mClose').onclick=closeModal;
$('#modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
document.addEventListener('click',e=>{
  const learn=e.target.closest('[data-learn]'); if(learn){ openKnowledge(learn.dataset.learn); return; }
  const doex=e.target.closest('[data-doex]'); if(doex){ openExercise(doex.dataset.doex); return; }
  const chk=e.target.closest('[data-chk]'); if(chk){ toggle(chk.dataset.chk); return; }
  const delb=e.target.closest('[data-del]'); if(delb){ del(delb.dataset.del); return; }
});

/* ============ 启动 ============ */
load(); render();
</script>
</body>
